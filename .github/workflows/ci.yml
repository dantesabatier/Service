name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, intl, mbstring, openssl, dom, curl, gettext, redis, memcached, apcu
          ini-values: zend.assertions=1, apc.enable_cli=1
          coverage: none

      # The stack is consumed from Packagist like any other application would
      # consume it. Resolving the siblings' master instead would test a combination
      # no user can install, and would fail this repository's CI whenever an
      # unrelated one committed.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/phpunit --no-coverage

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, intl, mbstring, openssl, dom, curl, gettext, redis, memcached, apcu
          ini-values: zend.assertions=1, apc.enable_cli=1
          coverage: none

      # The stack is consumed from Packagist like any other application would
      # consume it. Resolving the siblings' master instead would test a combination
      # no user can install, and would fail this repository's CI whenever an
      # unrelated one committed.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Psalm
        run: vendor/bin/psalm --output-format=github --no-progress

      # Advisory, as CONTRIBUTING says: Rector proposes modernisations and not every
      # proposal is wanted, so its report informs a review rather than blocking one.
      - name: Rector
        continue-on-error: true
        run: vendor/bin/rector process src --dry-run --no-progress-bar
